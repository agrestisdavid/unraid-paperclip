name: Validate and smoke test

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE, 'LICENSES/**']
  pull_request:
    paths-ignore: ['**/*.md', LICENSE, 'LICENSES/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
  smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-result
          path: test-results/smoke.json
          if-no-files-found: warn
